ect x="200" y="84" width="500" height="210" rx="10" fill="#1a1f27" stroke="#2c323d"/><text x="222" y="114" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e9ee" text-anchor="start">Admin token</text><rect x="222" y="130" width="456" height="34" rx="7" fill="#11151b" stroke="#3a414d"/><text x="236" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#c9ccd2" text-anchor="start">●●●●-●●●●-●●●●-●●●●</text><text x="222" y="192" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a93a0" text-anchor="start">For a device you chose not to trust: it unlocks everything except</text><text x="222" y="210" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a93a0" text-anchor="start">approving devices. Read it on the server with</text><text x="497" y="210" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#38bdf8" text-anchor="start">anton-ticketing --print-admin-token</text><rect x="222" y="236" width="98" height="32" rx="7" fill="#3b82f6"/><text x="271" y="257" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Save token</text><rect x="219" y="127" width="462" height="40" rx="8" fill="none" stroke="#4ade80" stroke-width="2.5"/><circle cx="681" cy="127" r="11" fill="#4ade80"/><text x="681" y="131.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#04210f" text-anchor="middle">1</text><rect x="219" y="233" width="104" height="38" rx="8" fill="none" stroke="#4ade80" stroke-width="2.5"/><circle cx="323" cy="233" r="11" fill="#4ade80"/><text x="323" y="237.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#04210f" text-anchor="middle">2</text>
